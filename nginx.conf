server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the hashed asset chunks.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything else falls back to index.html (single-page app).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
