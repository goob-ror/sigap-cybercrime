server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the hashed asset chunks.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Revalidated on every load, so a new deployment reaches browsers on their next visit.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # nginx does not know this extension, and would call it a generic file.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # This static setup has no online API. A 404 tells the app so, rather than the app's own page.
  location /api/ {
    return 404;
  }

  # Offline kit. A missing file must be a 404, not the app's page.
  location /unduh/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Everything else falls back to index.html (single-page app).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
